[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-bridge"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21",
    "pyotp>=2.10.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.2.1", "av<17"]
cuda = [
    "nvidia-cublas-cu12==12.4.5.8; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12==9.1.0.70; sys_platform != 'darwin'",
]
qr = ["qrcode[pil]>=8.2"]
tts = ["edge-tts>=7.3.1"]

[project.scripts]
telegram-bridge = "telegram_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_bridge"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
